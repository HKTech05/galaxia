<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Dashboard | Galaxia</title>
    <meta name="description" content="Galaxia WhatsApp-style Chat Dashboard — manage conversations across all business numbers.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-wrapper" id="app">
        <!-- Top Header -->
        <header class="top-header">
            <div class="top-header-left">
                <h1>Galaxia</h1>
                <span class="badge-role" id="roleBadge">Owner</span>
            </div>
            <div class="top-header-right">
                <div class="connection-status">
                    <div class="connection-dot offline" id="connDot"></div>
                    <span id="connText">Connecting…</span>
                </div>
                <button class="btn-logout" id="logoutBtn" onclick="handleLogout()">Log Out</button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- LEFT PANEL -->
            <div class="left-panel" id="leftPanel">
                <!-- Number Tabs -->
                <div class="number-tabs" id="numberTabs"></div>

                <!-- Search -->
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search conversations...">
                </div>

                <!-- Chat List -->
                <div class="chat-list" id="chatList"></div>
            </div>

            <!-- RIGHT PANEL -->
            <div class="right-panel" id="rightPanel">
                <!-- Empty State (default) -->
                <div class="empty-state" id="emptyState">
                    <div class="empty-state-icon">💬</div>
                    <h2>Galaxia Chat Dashboard</h2>
                    <p>Select a conversation from the left to view messages. Toggle between bot and human mode for each chat.</p>
                </div>

                <!-- Chat View (hidden by default) -->
                <div id="chatView" style="display:none; flex:1; flex-direction:column;">
                    <!-- Chat Header -->
                    <div class="chat-header">
                        <div class="chat-header-left">
                            <button class="btn-back-mobile" id="btnBackMobile" style="display:none; background:none; border:none; color:var(--text-secondary); font-size:20px; cursor:pointer; margin-right:4px;" onclick="goBackToList()">←</button>
                            <div class="chat-header-avatar" id="chatHeaderAvatar">?</div>
                            <div class="chat-header-info">
                                <h3 id="chatHeaderName">+91 98765 43210</h3>
                                <p id="chatHeaderSub">Digital Diaries · Last seen 2m ago</p>
                            </div>
                        </div>
                        <div class="chat-header-right">
                            <div class="tag-buttons">
                                <button class="tag-btn" data-tag="hot" onclick="toggleTag('hot')">🔥 Hot</button>
                                <button class="tag-btn" data-tag="followup" onclick="toggleTag('followup')">📌 Follow-up</button>
                                <button class="tag-btn" data-tag="resolved" onclick="toggleTag('resolved')">✅ Resolved</button>
                            </div>
                            <div class="mode-toggle" onclick="toggleMode()">
                                <span class="mode-label bot" id="modeLabelBot">🤖</span>
                                <div class="toggle-switch" id="modeSwitch"></div>
                                <span class="mode-label human" id="modeLabelHuman">👤</span>
                            </div>
                        </div>
                    </div>

                    <!-- Messages Area -->
                    <div class="messages-area" id="messagesArea"></div>

                    <!-- Message Input (visible when human mode) -->
                    <div class="message-input-area" id="messageInputArea" style="display:none;">
                        <input type="text" id="messageInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
                        <button class="btn-send" onclick="sendMessage()">➤</button>
                    </div>

                    <!-- Bot Active Banner (visible when bot mode) -->
                    <div class="bot-active-banner" id="botBanner">
                        <p>🤖 Bot is handling this conversation · <a href="#" onclick="toggleMode(); return false;" style="color:var(--green); font-weight:700;">Switch to Human</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Socket.IO Client -->
    <script src="http://localhost:4000/socket.io/socket.io.js"></script>

    <script>
    /* ═══════════════════════════════════════════════════════
       GALAXIA CHAT DASHBOARD — LIVE API MODE
       Connected to chatbot backend at API_BASE via REST + Socket.IO
       ═══════════════════════════════════════════════════════ */

    const API_BASE = 'http://localhost:4000';

    // ─── CONFIG: Phone Number Mapping ────────────────────
    const PHONE_NUMBERS = {
        digital_diaries: {
            id: '1117204771469353',
            label: 'Digital Diaries',
            icon: '🎬',
            color: '#f59e0b'
        }
    };

    // ─── SESSION ─────────────────────────────────────────
    let session = null;
    try {
        session = JSON.parse(localStorage.getItem('chatbot_session'));
    } catch(e) {}

    if (!session) {
        window.location.href = 'login.html';
    }

    // ─── STATE ───────────────────────────────────────────
    let currentTab = 'all';
    let currentChatId = null; // This is the session_id string like "wa_919876543210"
    let searchQuery = '';
    let chatSessions = []; // Live data from API
    let currentMessages = []; // Messages for the currently open chat

    // ─── SOCKET.IO ───────────────────────────────────────
    let socket = null;

    function initSocket() {
        socket = io(API_BASE);

        socket.on('connect', () => {
            console.log('[Socket.IO] Connected:', socket.id);
            document.getElementById('connDot').classList.remove('offline');
            document.getElementById('connText').textContent = 'Connected';
        });

        socket.on('disconnect', () => {
            console.log('[Socket.IO] Disconnected');
            document.getElementById('connDot').classList.add('offline');
            document.getElementById('connText').textContent = 'Disconnected';
        });

        // New message received
        socket.on('new_message', (data) => {
            console.log('[Socket.IO] new_message:', data);
            const { sessionId, message, session: updatedSession } = data;

            // Update local sessions cache
            updateLocalSession(updatedSession);

            // If this chat is currently open, append the message
            if (currentChatId === sessionId) {
                currentMessages.push(message);
                renderMessages();
            }

            // Re-render chat list
            renderChatList();
            buildNumberTabs();
        });

        // Session updated (mode change, tags change, etc.)
        socket.on('session_updated', (updatedSession) => {
            console.log('[Socket.IO] session_updated:', updatedSession);
            updateLocalSession(updatedSession);
            renderChatList();
            buildNumberTabs();
        });
    }

    function updateLocalSession(updatedSession) {
        if (!updatedSession) return;
        const idx = chatSessions.findIndex(s => s.session_id === updatedSession.session_id);
        if (idx >= 0) {
            chatSessions[idx] = updatedSession;
        } else {
            chatSessions.unshift(updatedSession);
        }
    }

    // ─── API HELPERS ─────────────────────────────────────
    async function apiGet(path) {
        const res = await fetch(`${API_BASE}${path}`);
        if (!res.ok) throw new Error(`API ${path} failed: ${res.status}`);
        return res.json();
    }

    async function apiPost(path, body) {
        const res = await fetch(`${API_BASE}${path}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error(`API POST ${path} failed: ${res.status}`);
        return res.json();
    }

    async function apiPatch(path, body) {
        const res = await fetch(`${API_BASE}${path}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error(`API PATCH ${path} failed: ${res.status}`);
        return res.json();
    }

    // ─── INIT ────────────────────────────────────────────
    async function init() {
        // Set role badge
        document.getElementById('roleBadge').textContent = session.role === 'owner' ? 'Owner' : session.displayName;

        // Build number tabs
        buildNumberTabs();

        // Load chats from API
        await loadChats();

        // Search handler
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderChatList();
        });

        // Mobile responsiveness
        handleResize();
        window.addEventListener('resize', handleResize);

        // Connect Socket.IO
        initSocket();
    }

    // ─── LOAD CHATS ──────────────────────────────────────
    async function loadChats() {
        try {
            chatSessions = await apiGet('/api/chats');
            renderChatList();
            buildNumberTabs();
        } catch (err) {
            console.error('Failed to load chats:', err);
        }
    }

    // ─── NUMBER TABS ─────────────────────────────────────
    function buildNumberTabs() {
        const container = document.getElementById('numberTabs');
        const allowedNumbers = session.assignedNumbers || Object.keys(PHONE_NUMBERS);

        let html = `<button class="number-tab ${currentTab === 'all' ? 'active' : ''}" onclick="switchTab('all')">All`;

        const totalUnread = getFilteredSessions('all').reduce((sum, s) => sum + (s.unread_count || 0), 0);
        if (totalUnread > 0) html += `<span class="tab-count">${totalUnread}</span>`;
        html += `</button>`;

        for (const key of allowedNumbers) {
            const num = PHONE_NUMBERS[key];
            if (!num) continue;
            const unread = getFilteredSessions(key).reduce((sum, s) => sum + (s.unread_count || 0), 0);
            html += `<button class="number-tab ${currentTab === key ? 'active' : ''}" onclick="switchTab('${key}')">${num.icon} ${num.label}`;
            if (unread > 0) html += `<span class="tab-count">${unread}</span>`;
            html += `</button>`;
        }

        container.innerHTML = html;
    }

    function switchTab(tab) {
        currentTab = tab;
        buildNumberTabs();
        renderChatList();
    }

    // ─── FILTER SESSIONS ─────────────────────────────────
    function getFilteredSessions(tab) {
        return chatSessions.filter(s => {
            if (s.phone_number_id === '1015208551685641') return false;
            if (['917355630009', '919867677811', '7355630009', '9867677811'].includes(s.customer_phone)) return false;
            if (tab !== 'all') {
                const num = PHONE_NUMBERS[tab];
                if (num && s.phone_number_id !== num.id) return false;
            }
            return true;
        });
    }

    // ─── RENDER CHAT LIST ────────────────────────────────
    function renderChatList() {
        const container = document.getElementById('chatList');
        let sessions = getFilteredSessions(currentTab);

        // Apply search filter
        if (searchQuery) {
            sessions = sessions.filter(s =>
                (s.display_name || '').toLowerCase().includes(searchQuery) ||
                (s.customer_phone || '').includes(searchQuery) ||
                (s.last_message || '').toLowerCase().includes(searchQuery)
            );
        }

        // Sort by last message time (newest first)
        sessions.sort((a, b) => {
            const timeA = a.last_message_at ? new Date(a.last_message_at).getTime() : 0;
            const timeB = b.last_message_at ? new Date(b.last_message_at).getTime() : 0;
            return timeB - timeA;
        });

        if (sessions.length === 0) {
            container.innerHTML = `
                <div style="padding:40px 20px; text-align:center; color:var(--text-dim);">
                    <p style="font-size:32px; margin-bottom:12px;">📭</p>
                    <p style="font-size:13px; font-weight:600;">No conversations yet</p>
                    <p style="font-size:11px; margin-top:8px; color:var(--text-muted);">Send a test webhook to create one!</p>
                </div>`;
            return;
        }

        container.innerHTML = sessions.map(s => {
            const initial = (s.display_name || s.customer_phone || '?').charAt(0).toUpperCase();
            const mode = s.is_human_active ? 'human' : 'bot';
            const modeClass = mode === 'bot' ? 'bot-active' : 'human-active';
            const modeIcon = mode === 'bot' ? '🤖' : '👤';
            const timeStr = s.last_message_at ? formatTime(new Date(s.last_message_at)) : '';
            const tags = s.tags || [];
            const platformIcon = s.platform === 'instagram' ? '📷' : '';
            const unread = s.unread_count || 0;

            return `
            <div class="chat-item ${currentChatId === s.session_id ? 'active' : ''}" onclick="openChat('${s.session_id}')">
                <div class="chat-avatar ${modeClass}">${initial}</div>
                <div class="chat-info">
                    <div class="chat-info-top">
                        <span class="chat-name">${platformIcon} ${escapeHtml(s.display_name || s.customer_phone)}</span>
                        <span class="chat-time ${unread > 0 ? 'has-unread' : ''}">${timeStr}</span>
                    </div>
                    <div class="chat-info-bottom">
                        <span class="chat-preview">${escapeHtml(s.last_message || 'No messages')}</span>
                        ${unread > 0 ? `<span class="unread-badge">${unread}</span>` : ''}
                        <span class="chat-mode-indicator">${modeIcon}</span>
                    </div>
                    ${tags.length > 0 ? `
                    <div class="chat-tags">
                        ${tags.map(t => `<span class="tag tag-${t}">${t === 'hot' ? '🔥 Hot Lead' : t === 'followup' ? '📌 Follow-up' : t === 'resolved' ? '✅ Resolved' : '🆕 New'}</span>`).join('')}
                    </div>` : ''}
                </div>
            </div>`;
        }).join('');
    }

    // ─── OPEN CHAT ───────────────────────────────────────
    async function openChat(sessionId) {
        currentChatId = sessionId;
        const chat = chatSessions.find(s => s.session_id === sessionId);
        if (!chat) return;

        // Show chat view
        document.getElementById('emptyState').style.display = 'none';
        const chatView = document.getElementById('chatView');
        chatView.style.display = 'flex';

        // Header
        document.getElementById('chatHeaderAvatar').textContent = (chat.display_name || '?').charAt(0);
        document.getElementById('chatHeaderName').textContent = `${chat.display_name || chat.customer_phone}`;
        const timeAgo = chat.last_message_at ? formatTime(new Date(chat.last_message_at)) : 'never';
        document.getElementById('chatHeaderSub').textContent = `🎬 Digital Diaries · ${chat.platform} · Last seen ${timeAgo}`;

        // Mode toggle
        updateModeUI(chat.is_human_active ? 'human' : 'bot');

        // Tags
        updateTagButtons(chat.tags || []);

        // Load messages
        try {
            const data = await apiGet(`/api/chats/${sessionId}`);
            currentMessages = data.messages || [];
            renderMessages();
        } catch (err) {
            console.error('Failed to load messages:', err);
        }

        // Mark as read
        try {
            await apiPatch(`/api/chats/${sessionId}/read`, {});
            chat.unread_count = 0;
        } catch (err) {
            console.error('Failed to mark read:', err);
        }

        // Re-render chat list
        renderChatList();
        buildNumberTabs();

        // Mobile: hide left, show right
        if (window.innerWidth <= 768) {
            document.getElementById('leftPanel').classList.add('hidden');
            document.getElementById('rightPanel').classList.remove('hidden');
            document.getElementById('btnBackMobile').style.display = 'block';
        }
    }

    // ─── RENDER MESSAGES ─────────────────────────────────
    function renderMessages() {
        const container = document.getElementById('messagesArea');

        if (currentMessages.length === 0) {
            container.innerHTML = `<div style="text-align:center; color:var(--text-dim); padding:40px;"><p>No messages yet</p></div>`;
            return;
        }

        let html = '';
        let lastDate = '';

        for (const msg of currentMessages) {
            const msgTime = new Date(msg.created_at);
            const dateStr = msgTime.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
            if (dateStr !== lastDate) {
                html += `<div class="date-divider"><span>${dateStr}</span></div>`;
                lastDate = dateStr;
            }

            const isUser = msg.role === 'user';
            const rowClass = isUser ? 'user' : (msg.is_human ? 'admin' : 'bot');
            const senderLabel = isUser ? 'Customer' : (msg.is_human ? 'Admin' : 'Bot');
            const senderClass = isUser ? 'user-label' : (msg.is_human ? 'human-label' : 'bot-label');
            const timeStr = msgTime.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

            // Convert markdown-like bold (*text*) to <strong>
            const formatted = escapeHtml(msg.message)
                .replace(/\*([^*]+)\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');

            html += `
            <div class="message-row ${rowClass}">
                <div class="message-bubble">
                    <div>${formatted}</div>
                    <div class="message-meta">
                        <span class="message-sender ${senderClass}">${senderLabel}</span>
                        <span class="message-time">${timeStr}</span>
                    </div>
                </div>
            </div>`;
        }

        container.innerHTML = html;
        container.scrollTop = container.scrollHeight;
    }

    // ─── SEND MESSAGE ────────────────────────────────────
    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text || !currentChatId) return;

        input.value = '';
        input.disabled = true;

        try {
            await apiPost(`/api/chats/${currentChatId}/send`, { message: text });
            // The Socket.IO event will handle appending the message
        } catch (err) {
            console.error('Failed to send message:', err);
            input.value = text; // Restore on failure
        } finally {
            input.disabled = false;
            input.focus();
        }
    }

    // ─── MODE TOGGLE ─────────────────────────────────────
    async function toggleMode() {
        if (!currentChatId) return;
        const chat = chatSessions.find(s => s.session_id === currentChatId);
        if (!chat) return;

        const newMode = !chat.is_human_active;

        try {
            await apiPatch(`/api/chats/${currentChatId}/mode`, { is_human_active: newMode });
            chat.is_human_active = newMode;
            updateModeUI(newMode ? 'human' : 'bot');
            renderChatList();
        } catch (err) {
            console.error('Failed to toggle mode:', err);
        }
    }

    function updateModeUI(mode) {
        const switchEl = document.getElementById('modeSwitch');
        const inputArea = document.getElementById('messageInputArea');
        const botBanner = document.getElementById('botBanner');

        if (mode === 'human') {
            switchEl.classList.add('human-mode');
            inputArea.style.display = 'flex';
            botBanner.style.display = 'none';
        } else {
            switchEl.classList.remove('human-mode');
            inputArea.style.display = 'none';
            botBanner.style.display = 'block';
        }
    }

    // ─── TAGS ────────────────────────────────────────────
    async function toggleTag(tag) {
        if (!currentChatId) return;
        const chat = chatSessions.find(s => s.session_id === currentChatId);
        if (!chat) return;

        let tags = chat.tags || [];
        const idx = tags.indexOf(tag);
        if (idx >= 0) {
            tags.splice(idx, 1);
        } else {
            tags.push(tag);
        }

        try {
            await apiPatch(`/api/chats/${currentChatId}/tags`, { tags });
            chat.tags = tags;
            updateTagButtons(tags);
            renderChatList();
        } catch (err) {
            console.error('Failed to update tags:', err);
        }
    }

    function updateTagButtons(tags) {
        document.querySelectorAll('.tag-btn').forEach(btn => {
            const t = btn.dataset.tag;
            btn.className = 'tag-btn';
            if (tags.includes(t)) {
                btn.classList.add(`active-${t}`);
            }
        });
    }

    // ─── HELPERS ─────────────────────────────────────────
    function formatTime(date) {
        const now = new Date();
        const diff = now - date;

        if (diff < 60 * 1000) return 'now';
        if (diff < 3600 * 1000) return `${Math.floor(diff / 60000)}m`;
        if (diff < 24 * 3600 * 1000) return `${Math.floor(diff / 3600000)}h`;
        return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text || '';
        return div.innerHTML;
    }

    function handleLogout() {
        localStorage.removeItem('chatbot_session');
        window.location.href = 'login.html';
    }

    function goBackToList() {
        document.getElementById('leftPanel').classList.remove('hidden');
        document.getElementById('rightPanel').classList.add('hidden');
    }

    function handleResize() {
        const mobile = window.innerWidth <= 768;
        const backBtn = document.getElementById('btnBackMobile');

        if (!mobile) {
            document.getElementById('leftPanel').classList.remove('hidden');
            document.getElementById('rightPanel').classList.remove('hidden');
            backBtn.style.display = 'none';
        } else {
            if (currentChatId) {
                backBtn.style.display = 'block';
            }
        }
    }

    // ─── BOOT ────────────────────────────────────────────
    init();
    </script>
</body>
</html>
